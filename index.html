<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/fit-strong-90/favicon.svg" type="image/svg+xml" />
    <!-- PNG: iOS does not use an SVG Home Screen icon, and falls back to a snapshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/fit-strong-90/apple-touch-icon.png" />
    <!-- Pinch-zoom stays on: people with low vision need it, and inputs are 17px so iOS never zooms on focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Your health, day by day — kept on your device." />
    <meta name="color-scheme" content="light dark" />
    <!-- The grouped page colour (BAR_COLOR in src/lib/themeColor.ts). Keyed to the device's scheme; once the app's own theme is chosen, both follow it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` keeps the clock and battery dark on the light page; `black-translucent` draws them white, which is unreadable there. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitStrong" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/fit-strong-90/manifest.webmanifest" />
    <title>FitStrong</title>
    <!-- The theme before the first paint, from the synchronous theme flag (THEME_KEY in src/store/useStore.ts). Without it a dark launch flashes light. A chosen theme also sets the bars' colour, as src/lib/themeColor.ts does after launch. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fit-strong-90-theme');
          var system = !t || t === 'system';
          var dark = t === 'dark' || (system && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (!system) {
            var bars = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < bars.length; i++) bars[i].setAttribute('content', dark ? '#0a0a0a' : '#f3f4f5');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
